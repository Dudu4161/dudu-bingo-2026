<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DUDU BINGO 2026</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Ethiopic",sans-serif;
  background:#f2f4f8;
  color:#17202a;
}

.container{
  max-width:700px;
  margin:auto;
  padding:12px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#151515,#343434);
  color:white;
  padding:18px 12px;
  border-radius:16px;
  text-align:center;
  margin-bottom:12px;
  box-shadow:0 4px 12px #0002;
}

.header h1{
  margin:0;
  font-size:27px;
}

.header p{
  margin:6px 0 0;
  font-size:14px;
}

/* LOGIN */
.login{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:12px;
}

.login input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  width:100%;
  background:#111;
  color:white;
}

/* INFO */
.info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.infoBox{
  background:white;
  border-radius:12px;
  padding:10px 5px;
  text-align:center;
  box-shadow:0 2px 6px #0001;
}

.infoBox small{
  display:block;
  color:#777;
  font-size:11px;
}

.infoBox strong{
  display:block;
  font-size:20px;
  margin-top:3px;
}

/* CURRENT NUMBER */
.current{
  background:#111;
  color:white;
  border-radius:16px;
  padding:20px;
  text-align:center;
  margin-bottom:12px;
}

.current .label{
  font-size:13px;
  opacity:.8;
}

.currentNumber{
  font-size:65px;
  font-weight:900;
  margin:4px 0;
}

.currentAmharic{
  font-size:18px;
}

/* CONTROLS */
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.call{
  background:#e63946;
  color:white;
}

.auto{
  background:#2a9d8f;
  color:white;
}

.stop{
  background:#555;
  color:white;
}

/* RECENT */
.section{
  background:white;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
}

.sectionTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.recent{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.recent span{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#eee;
  font-weight:bold;
}

/* CARD SELECTOR */
.cardSelector{
  display:flex;
  gap:8px;
}

.cardSelector select{
  flex:1;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

.cardSelector button{
  background:#111;
  color:white;
}

/* BINGO CARD */
.bingoCard{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
}

.bingoHead{
  background:#111;
  color:white;
  padding:11px 2px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
  border-radius:5px;
}

.cell{
  min-height:58px;
  background:#f4f4f4;
  border:2px solid #ddd;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:bold;
  position:relative;
}

.cell.called{
  background:#ffd166;
  border-color:#e9a900;
}

.cell.free{
  background:#222;
  color:white;
  font-size:13px;
}

/* NUMBERS */
.numberGrid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:5px;
}

.number{
  aspect-ratio:1;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  font-size:14px;
  font-weight:bold;
}

.number.called{
  background:#e63946;
  color:white;
}

.number.current{
  background:#111;
  color:white;
}

/* BINGO BUTTON */
.bingoButton{
  width:100%;
  background:#f4a261;
  color:#111;
  font-size:18px;
  margin-top:10px;
}

/* POPUP */
.popup{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.popupBox{
  background:white;
  width:100%;
  max-width:400px;
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
}

.popupBox h2{
  font-size:35px;
  margin:0 0 10px;
}

.popupBox p{
  font-size:17px;
}

.popupBox button{
  background:#111;
  color:white;
  width:100%;
}

/* FOOTER */
.footer{
  text-align:center;
  color:#777;
  font-size:12px;
  padding:15px;
}

@media(max-width:420px){
  .numberGrid{
    grid-template-columns:repeat(8,1fr);
  }

  .cell{
    min-height:52px;
    font-size:18px;
  }

  .currentNumber{
    font-size:55px;
  }
}
</style>
</head>

let calledNumbers = [];
let autoTimer = null;

let card = [];

};


/* LOGIN */

function login(){

  const input =
    document.getElementById("playerName");

  player = input.value.trim();

  if(!player){

    alert("እባክዎ ስምዎን ያስገቡ");

    return;
  }

  document.getElementById("players")
    .textContent = "1";

  alert(
    "እንኳን ወደ DUDU BINGO በደህና መጡ " +
    player
  );

}


/* CREATE NUMBER BOARD */

function createNumberBoard(){

  const grid =
    document.getElementById("numberGrid");

  grid.innerHTML = "";

  for(let i=1;i<=75;i++){

    const div =
      document.createElement("div");

    div.className = "number";

    div.id = "num-" + i;

    div.textContent = i;

    grid.appendChild(div);

  }

}


/* CARD SELECT */

function createCardSelector(){

  const select =
    document.getElementById("cardSelect");

  for(let i=1;i<=600;i++){

    const option =
      document.createElement("option");

    option.value = i;

    option.textContent =
      "ካርድ " + i;

    select.appendChild(option);

  }

}


/* RANDOM NUMBER */

function randomFromRange(min,max,used){

  let n;

  do{

    n =
      Math.floor(
        Math.random() *
        (max-min+1)
      ) + min;

  }while(used.includes(n));

  return n;

}


/* GENERATE CARD */

function generateCard(){

  card = [];

  const ranges = [

    [1,15],
    [16,30],
    [31,45],
    [46,60],
    [61,75]

  ];

  for(let row=0;row<5;row++){

    for(let col=0;col<5;col++){

      if(row===2 && col===2){

        card.push(0);

        continue;

      }

      let used = card.filter(
        x => x !== 0
      );

      let n =
        randomFromRange(
          ranges[col][0],
          ranges[col][1],
          used
        );

      card.push(n);

    }

  }

}


/* SHOW CARD */

function showCard(){

  generateCard();

  for(let i=0;i<25;i++){

    const cell =
      document.getElementById("c"+i);

    cell.classList.remove("called");

    if(i===12){

      cell.textContent = "FREE";

      continue;

    }

    cell.textContent =
      card[i];

  }

}


/* NEW CARD */

function newCard(){

  showCard();

}


/* CALL NUMBER */

function callNumber(){

  if(calledNumbers.length >= 75){

    alert("ሁሉም 75 ቁጥሮች ተጠርተዋል");

    stopAuto();

    return;
  }

  let available = [];

  for(let i=1;i<=75;i++){

    if(!calledNumbers.includes(i)){

      available.push(i);

    }

  }

  const index =
    Math.floor(
      Math.random()*available.length
    );

  const number =
    available[index];

  calledNumbers.push(number);

  showCalled(number);

}


/* SHOW CALLED */

function showCalled(number){

  document.getElementById(
    "currentNumber"
  ).textContent = number;

  document.getElementById(
    "currentAmharic"
  ).textContent =
    amharicNumbers[number] || "";

  document.getElementById(
    "calledCount"
  ).textContent =
    calledNumbers.length;

  const numberElement =
    document.getElementById(
      "num-"+number
    );

  if(numberElement){

    numberElement.classList.add(
      "called"
    );

  }

  updateCardCalled();

  updateRecent();

}


/* UPDATE CARD */

function updateCardCalled(){

  for(let i=0;i<25;i++){

    const cell =
      document.getElementById("c"+i);

    cell.classList.remove("called");

    if(i===12) continue;

    if(calledNumbers.includes(card[i])){

      cell.classList.add("called");

    }

  }

}


/* RECENT */

function updateRecent(){

  const box =
    document.getElementById("recent");

  box.innerHTML = "";

  const recent =
    calledNumbers.slice(-10).reverse();

  recent.forEach(n=>{

    const span =
      document.createElement("span");

    span.textContent = n;

    box.appendChild(span);

  });

}


/* AUTO */

function toggleAuto(){

  if(autoTimer){

    stopAuto();

    return;

  }

  callNumber();

  autoTimer =
    setInterval(
      callNumber,
      3000
    );

}


/* STOP */

function stopAuto(){

  if(autoTimer){

    clearInterval(autoTimer);

    autoTimer = null;

  }

}


/* BINGO CHECK */

function checkBingo(){

  if(!card.length){

    alert("ካርድ አልተዘጋጀም");

    return;

  }

  let win = false;

  /* HORIZONTAL */

  for(let r=0;r<5;r++){

    let ok=true;

    for(let c=0;c<5;c++){

      let index =
        r*5+c;

      if(index===12)
        continue;

      if(!calledNumbers.includes(card[index])){

        ok=false;

      }

    }

    if(ok) win=true;

  }


  /* VERTICAL */

  for(let c=0;c<5;c++){

    let ok=true;

    for(let r=0;r<5;r++){

      let index =
        r*5+c;

      if(index===12)
        continue;

      if(!calledNumbers.includes(card[index])){

        ok=false;

      }

    }

    if(ok) win=true;

  }


  /* DIAGONAL */

  let diag1=true;

  let diag2=true;

  for(let i=0;i<5;i++){

    let a=i*5+i;

    let b=i*5+(4-i);

    if(a!==12 &&
       !calledNumbers.includes(card[a])){

      diag1=false;

    }

    if(b!==12 &&
       !calledNumbers.includes(card[b])){

      diag2=false;

    }

  }

  if(diag1 || diag2){

    win=true;

  }


  /* FOUR CORNERS */

  const corners=[
    0,4,20,24
  ];

  if(
    corners.every(
      i =>
        calledNumbers.includes(
          card[i]
        )
    )
  ){

    win=true;

  }


  if(win){

    stopAuto();

    document.getElementById(
      "winnerText"
    ).textContent =
      player
      ? player+" እንኳን ደስ አለዎት! BINGO አሸንፈዋል!"
      : "እንኳን ደስ አለዎት! BINGO!";

    document.getElementById(
      "popup"
    ).style.display="flex";

  }else{

    alert(
      "እስካሁን BINGO አልሆነም።"
    );

  }

}


/* CLOSE POPUP */

function closePopup(){

  document.getElementById(
    "popup"
  ).style.display="none";

}


/* NEW GAME */

function newGame(){

  stopAuto();

  calledNumbers=[];

  document.getElementById(
    "currentNumber"
  ).textContent="--";

  document.getElementById(
    "currentAmharic"
  ).textContent=
    "ጨዋታው አልጀመረም";

  document.getElementById(
    "calledCount"
  ).textContent="0";

  document.getElementById(
    "recent"
  ).innerHTML="";

  document.querySelectorAll(
    ".number"
  ).forEach(
    el=>el.classList.remove("called")
  );

  showCard();
