function createNumberBoard() {
  var grid = document.getElementById('numberGrid');
  grid.innerHTML = '';
  for (var i = 1; i <= 75; i++) {
    var div = document.createElement('div');
    div.className = 'number';
    div.id = 'num-' + i;
    div.textContent = i;
    grid.appendChild(div);
  }
}

function randomFromRange(min, max, used) {
  var n;
  do {
    n = Math.floor(Math.random() * (max - min + 1)) + min;
  } while (used.indexOf(n) !== -1);
  return n;
}

function generateSingleCard() {
  var card = [];
  var ranges = [[1,15],[16,30],[31,45],[46,60],[61,75]];
  for (var row = 0; row < 5; row++) {
    for (var col = 0; col < 5; col++) {
      if (row === 2 && col === 2) { card.push(0); continue; }
      var used = card.filter(function(x) { return x !== 0; });
      var n = randomFromRange(ranges[col][0], ranges[col][1], used);
      card.push(n);
    }
  }
  return card;
}

function updateCardInfo() {
  document.getElementById('cardInfo').textContent = 'ካርድ ' + (activeCardIndex + 1) + ' / ' + cards.length;
  document.getElementById('cardLabel').textContent = 'ካርድ #' + (activeCardIndex + 1);
}

function showActiveCard() {
  var card = cards[activeCardIndex];
  if (!card) return;
  for (var i = 0; i < 25; i++) {
    var cell = document.getElementById('c' + i);
    cell.classList.remove('called');
    if (i === 12) { cell.textContent = 'FREE'; continue; }
    cell.textContent = card[i];
  }
  updateCardInfo();
  updateCardCalled();
}

function updateCardCalled() {
  var card = cards[activeCardIndex];
  if (!card) return;
  for (var i = 0; i < 25; i++) {
    var cell = document.getElementById('c' + i);
    cell.classList.remove('called');
    if (i === 12) continue;
    if (calledNumbers.indexOf(card[i]) !== -1) cell.classList.add('called');
  }
}

function updateRecent() {
  var box = document.getElementById('recent');
  box.innerHTML = '';
  var recent = calledNumbers.slice(-10).reverse();
  recent.forEach(function(n) {
    var span = document.createElement('span');
    span.textContent = n;
    box.appendChild(span);
  });
}

function showCalled(number) {
  document.getElementById('currentNumber').textContent = number;
  document.getElementById('currentAmharic').textContent = amharicNumbers[number] || '';
  document.getElementById('calledCount').textContent = calledNumbers.length;
  var numberElement = document.getElementById('num-' + number);
  if (numberElement) numberElement.classList.add('called');
  updateCardCalled();
  updateRecent();
}

function checkCardBingo(card) {
  if (!card || card.length === 0) return false;
  for (var r = 0; r < 5; r++) {
    var ok = true;
    for (var c = 0; c < 5; c++) {
      var index = r * 5 + c;
      if (index === 12) continue;
      if (calledNumbers.indexOf(card[index]) === -1) ok = false;
    }
    if (ok) return true;
  }
  for (var c = 0; c < 5; c++) {
    var ok = true;
    for (var r = 0; r < 5; r++) {
      var index = r * 5 + c;
      if (index === 12) continue;
      if (calledNumbers.indexOf(card[index]) === -1) ok = false;
    }
    if (ok) return true;
  }
  var diag1 = true, diag2 = true;
  for (var i = 0; i < 5; i++) {
    var a = i * 5 + i;
    var b = i * 5 + (4 - i);
    if (a !== 12 && calledNumbers.indexOf(card[a]) === -1) diag1 = false;
    if (b !== 12 && calledNumbers.indexOf(card[b]) === -1) diag2 = false;
  }
  if (diag1 || diag2) return true;
  var corners = [0, 4, 20, 24];
  var allCorners = true;
  for (var k = 0; k < corners.length; k++) {
    if (calledNumbers.indexOf(card[corners[k]]) === -1) allCorners = false;
  }
  if (allCorners) return true;
  return false;
}

  roomCode = code;

  if (!roomSnap.exists()) {
    isAdmin = true;
    await setDoc(roomRef, {
      admin: playerName,
      createdAt: Date.now(),
      called: [],
      available: Array.from({length: 75}, function(_, i) { return i + 1; }),
      lastCalled: null
    });
  } else {
    var data = roomSnap.data();
    isAdmin = (data.admin === playerName);
  }
  
  await setDoc(doc(db, 'rooms', roomCode, 'players', playerName), {
    name: playerName,
    isAdmin: isAdmin,
    cards: [],
    joinedAt: Date.now()
  });
  
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('gameSection').classList.remove('hidden');
  document.getElementById('roomDisplay').textContent = roomCode;
  
  if (isAdmin) {
    document.getElementById('adminControls').style.display = 'grid';
  }
  
  createNumberBoard();
  listenToRoom();
  listenToPlayers();
});

// ========== LISTEN ROOM ==========
function listenToRoom() {
  if (unsubscribeRoom) unsubscribeRoom();
  unsubscribeRoom = onSnapshot(doc(db, 'rooms', roomCode), function(snap) {
    if (!snap.exists()) return;
    roomData = snap.data();
    calledNumbers = roomData.called || [];
    
    document.getElementById('calledCount').textContent = calledNumbers.length;
    if (roomData.lastCalled) {
      document.getElementById('currentNumber').textContent = roomData.lastCalled;
      document.getElementById('currentAmharic').textContent = amharicNumbers[roomData.lastCalled] || '';
    }
    
    document.querySelectorAll('.number').forEach(function(el) { el.classList.remove('called'); });
    calledNumbers.forEach(function(n) {
      var el = document.getElementById('num-' + n);
      if (el) el.classList.add('called');
    });
    
    updateRecent();
    updateCardCalled();
    checkAllCards();
  });
}

function listenToPlayers() {
  if (unsubscribePlayers) unsubscribePlayers();
  unsubscribePlayers = onSnapshot(collection(db, 'rooms', roomCode, 'players'), function(snap) {
    var list = document.getElementById('playersList');
    list.innerHTML = '';
    document.getElementById('playersCount').textContent = snap.size;
    
    snap.forEach(function(d) {
      var p = d.data();
      var div = document.createElement('div');
      div.className = 'playerRow';
      div.innerHTML = '<span class="name ' + (p.isAdmin ? 'admin' : '') + '">' + (p.isAdmin ? '👑 ' : '👤 ') + p.name + '</span><span>' + (p.cards ? p.cards.length : 0) + ' ካርድ</span>';
      list.appendChild(div);
    });
  });
}

// ========== CREATE CARDS ==========
document.getElementById('createCardsBtn').addEventListener('click', async function() {
  var count = parseInt(document.getElementById('cardNumberInput').value);
  if (isNaN(count) || count < 1 || count > 600) { alert('1-600 ብቻ!'); return; }
  
  cards = [];
  for (var i = 0; i < count; i++) cards.push(generateSingleCard());
  activeCardIndex = 0;
  
  await updateDoc(doc(db, 'rooms', roomCode, 'players', playerName), { cards: cards });
  
  document.getElementById('cardsNav').classList.remove('hidden');
  document.getElementById('cardLabel').classList.remove('hidden');
  document.getElementById('bingoCardGrid').classList.remove('hidden');
  document.getElementById('bingoBtn').classList.remove('hidden');
  document.getElementById('cardSelectSection').classList.add('hidden');
  
  showActiveCard();
  alert(count + ' ካርዶች ተፈጥረዋል! 🎴');
});

document.getElementById('prevCardBtn').addEventListener('click', function() {
  if (cards.length <= 1) return;
  activeCardIndex = (activeCardIndex - 1 + cards.length) % cards.length;
  showActiveCard();
});

document.getElementById('nextCardBtn').addEventListener('click', function() {
  if (cards.length <= 1) return;
  activeCardIndex = (activeCardIndex + 1) % cards.length;
  showActiveCard();
});

// ========== ADMIN: CALL NUMBER ==========
async function callNumber() {
  if (!isAdmin) return;
  if (!roomData) return;
  var available = roomData.available || [];
  if (available.length === 0) { stopAuto(); return; }
  
  var index = Math.floor(Math.random() * available.length);
  var number = available[index];
  var newAvailable = available.filter(function(x) { return x !== number; });
  var newCalled = (roomData.called || []).concat([number]);
  
  await updateDoc(doc(db, 'rooms', roomCode), {
    available: newAvailable,
    called: newCalled,
    lastCalled: number
  });
}

document.getElementById('callBtn').addEventListener('click', callNumber);

document.getElementById('autoBtn').addEventListener('click', function() {
  if (autoTimer) { stopAuto(); return; }
  callNumber();
  autoTimer = setInterval(callNumber, 3000);
});

document.getElementById('stopBtn').addEventListener('click', stopAuto);

function stopAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
}

document.getElementById('newGameBtn').addEventListener('click', async function() {
  if (!isAdmin) return;
  if (!confirm('አዲስ ጨዋታ ጀምር?')) return;
  stopAuto();
  await updateDoc(doc(db, 'rooms', roomCode), {
    called: [],
    available: Array.from({length: 75}, function(_, i) { return i + 1; }),
    lastCalled: null
  });
  document.querySelectorAll('.number').forEach(function(el) { el.classList.remove('called'); });
  document.getElementById('currentNumber').textContent = '--';
  document.getElementById('currentAmharic').textContent = 'ጨዋታው አልጀመረም';
});
