<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUDU BINGO 2026</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, "Noto Sans Ethiopic", sans-serif;
    background: #f2f4f8;
    color: #17202a;
  }
  .container { max-width: 700px; margin: auto; padding: 12px; }
  .header {
    background: linear-gradient(135deg, #151515, #343434);
    color: white;
    padding: 18px 12px;
    border-radius: 16px;
    text-align: center;
    margin-bottom: 12px;
    box-shadow: 0 4px 12px #0002;
  }
  .header h1 { margin: 0; font-size: 27px; }
  .header p { margin: 6px 0 0; font-size: 14px; }
  .login {
    background: white;
    padding: 18px;
    border-radius: 16px;
    margin-bottom: 12px;
  }
  .login input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 10px;
  }
  button {
    border: 0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  .primary { width: 100%; background: #111; color: white; }
  .info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .infoBox {
    background: white;
    border-radius: 12px;
    padding: 10px 5px;
    text-align: center;
    box-shadow: 0 2px 6px #0001;
  }
  .infoBox small { display: block; color: #777; font-size: 11px; }
  .infoBox strong { display: block; font-size: 20px; margin-top: 3px; }
  .current {
    background: #111;
    color: white;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 12px;
  }
  .current .label { font-size: 13px; opacity: 0.8; }
  .currentNumber {
    font-size: 65px;
    font-weight: 900;
    margin: 4px 0;
  }
  .currentAmharic { font-size: 18px; }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .call { background: #e63946; color: white; }
  .auto { background: #2a9d8f; color: white; }
  .stop { background: #555; color: white; }
  .newBtn { background: #111; color: white; }
  .section {
    background: white;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .sectionTitle {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .recent {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .recent span {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #eee;
    font-weight: bold;
  }
  .cardSelector {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .cardSelector input {
    flex: 1;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    text-align: center;
    font-weight: bold;
  }
  .cardSelector button {
    background: #111;
    color: white;
    white-space: nowrap;
  }
  .cardsNav {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .cardsNav button {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: #111;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
  }
  .cardsNav .info {
    font-size: 15px;
    font-weight: bold;
    color: #111;
    min-width: 120px;
    text-align: center;
  }
  .bingoCard {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    margin-bottom: 8px;
  }
  .bingoHead {
    background: #111;
    color: white;
    padding: 11px 2px;
    text-align: center;
    font-weight: bold;
    font-size: 18px;
    border-radius: 5px;
  }
  .cell {
    min-height: 58px;
    background: #f4f4f4;
    border: 2px solid #ddd;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: bold;
    position: relative;
  }
  .cell.called {
    background: #ffd166;
    border-color: #e9a900;
  }
  .cell.free {
    background: #222;
    color: white;
    font-size: 13px;
  }
  .cardLabel {
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    color: #111;
    padding: 8px;
    background: #f4f4f4;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .numberGrid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
  }
  .number {
    aspect-ratio: 1;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eee;
    font-size: 14px;
    font-weight: bold;
  }
  .number.called { background: #e63946; color: white; }
  .number.current { background: #111; color: white; }
  .bingoButton {
    width: 100%;
    background: #f4a261;
    color: #111;
    font-size: 18px;
    margin-top: 10px;
  }
  .popup {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .popupBox {
    background: white;
    width: 100%;
    max-width: 400px;
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
  }
  .popupBox h2 { font-size: 35px; margin: 0 0 10px; }
  .popupBox p { font-size: 17px; }
  .popupBox button { background: #111; color: white; width: 100%; }
  .footer {
    text-align: center;
    color: #777;
    font-size: 12px;
    padding: 15px;
  }
  .hidden { display: none !important; }
  @media(max-width: 420px) {
    .numberGrid { grid-template-columns: repeat(8, 1fr); }
    .cell { min-height: 52px; font-size: 18px; }
    .currentNumber { font-size: 55px; }
  }
</style>
</head>

<script>
var player = "";
var calledNumbers = [];
var autoTimer = null;
var cards = [];
var activeCardIndex = 0;
var gameId = "";
var checkInterval = null;

var amharicNumbers = {
  1:"አንድ",2:"ሁለት",3:"ሶስት",4:"አራት",5:"አምስት",
  6:"ስድስት",7:"ሰባት",8:"ስምንት",9:"ዘጠኝ",10:"አስር",
  11:"አስራ አንድ",12:"አስራ ሁለት",13:"አስራ ሶስት",14:"አስራ አራት",15:"አስራ አምስት",
  16:"አስራ ስድስት",17:"አስራ ሰባት",18:"አስራ ስምንት",19:"አስራ ዘጠኝ",20:"ሃያ",
  21:"ሃያ አንድ",22:"ሃያ ሁለት",23:"ሃያ ሶስት",24:"ሃያ አራት",25:"ሃያ አምስት",
  26:"ሃያ ስድስት",27:"ሃያ ሰባት",28:"ሃያ ስምንት",29:"ሃያ ዘጠኝ",30:"ሰላሳ",
  31:"ሰላሳ አንድ",32:"ሰላሳ ሁለት",33:"ሰላሳ ሶስት",34:"ሰላሳ አራት",35:"ሰላሳ አምስት",
  36:"ሰላሳ ስድስት",37:"ሰላሳ ሰባት",38:"ሰላሳ ስምንት",39:"ሰላሳ ዘጠኝ",40:"አርባ",
  41:"አርባ አንድ",42:"አርባ ሁለት",43:"አርባ ሶስት",44:"አርባ አራት",45:"አርባ አምስት",
  46:"አርባ ስድስት",47:"አርባ ሰባት",48:"አርባ ስምንት",49:"አርባ ዘጠኝ",50:"ሃምሳ",
  51:"ሃምሳ አንድ",52:"ሃምሳ ሁለት",53:"ሃምሳ ሶስት",54:"ሃምሳ አራት",55:"ሃምሳ አምስት",
  56:"ሃምሳ ስድስት",57:"ሃምሳ ሰባት",58:"ሃምሳ ስምንት",59:"ሃምሳ ዘጠኝ",60:"ስልሳ",
  61:"ስልሳ አንድ",62:"ስልሳ ሁለት",63:"ስልሳ ሶስት",64:"ስልሳ አራት",65:"ስልሳ አምስት",
  66:"ስልሳ ስድስት",67:"ስልሳ ሰባት",68:"ስልሳ ስምንት",69:"ስልሳ ዘጠኝ",70:"ሰባ",
  71:"ሰባ አንድ",72:"ሰባ ሁለት",73:"ሰባ ሶስት",74:"ሰባ አራት",75:"ሰባ አምስት"
};

function generateGameId() {
  var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  var id = '';
  for (var i = 0; i < 6; i++) {
    id += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return id;
}

function createNumberBoard() {
  var grid = document.getElementById('numberGrid');
  grid.innerHTML = '';
  for (var i = 1; i <= 75; i++) {
    var div = document.createElement('div');
    div.className = 'number';
    div.id = 'num-' + i;
    div.textContent = i;
    grid.appendChild(div);
  }
}

function randomFromRange(min, max, used) {
  var n;
  do {
    n = Math.floor(Math.random() * (max - min + 1)) + min;
  } while (used.indexOf(n) !== -1);
  return n;
}

function generateSingleCard() {
  var card = [];
  var ranges = [
    [1,15],[16,30],[31,45],[46,60],[61,75]
  ];
  for (var row = 0; row < 5; row++) {
    for (var col = 0; col < 5; col++) {
      if (row === 2 && col === 2) {
        card.push(0);
        continue;
      }
      var used = card.filter(function(x) { return x !== 0; });
      var n = randomFromRange(ranges[col][0], ranges[col][1], used);
      card.push(n);
    }
  }
  return card;
}

function updateCardInfo() {
  document.getElementById('cardInfo').textContent = 'ካርድ ' + (activeCardIndex + 1) + ' / ' + cards.length;
  document.getElementById('cardLabel').textContent = 'ካርድ #' + (activeCardIndex + 1);
}

function showActiveCard() {
  var card = cards[activeCardIndex];
  if (!card) return;
  for (var i = 0; i < 25; i++) {
    var cell = document.getElementById('c' + i);
    cell.classList.remove('called');
    if (i === 12) {
      cell.textContent = 'FREE';
      continue;
    }
    cell.textContent = card[i];
  }
  updateCardInfo();
  updateCardCalled();
}

function updateCardCalled() {
  var card = cards[activeCardIndex];
  if (!card) return;
  for (var i = 0; i < 25; i++) {
    var cell = document.getElementById('c' + i);
    cell.classList.remove('called');
    if (i === 12) continue;
    if (calledNumbers.indexOf(card[i]) !== -1) {
      cell.classList.add('called');
    }
  }
}

function updateRecent() {
  var box = document.getElementById('recent');
  box.innerHTML = '';
  var recent = calledNumbers.slice(-10).reverse();
  recent.forEach(function(n) {
    var span = document.createElement('span');
    span.textContent = n;
    box.appendChild(span);
  });
}

function showCalled(number) {
  document.getElementById('currentNumber').textContent = number;
  document.getElementById('currentAmharic').textContent = amharicNumbers[number] || '';
  document.getElementById('calledCount').textContent = calledNumbers.length;
  var numberElement = document.getElementById('num-' + number);
  if (numberElement) numberElement.classList.add('called');
  updateCardCalled();
  updateRecent();
}

function callNumber() {
  if (calledNumbers.length >= 75) {
    alert('ሁሉም 75 ቁጥሮች ተጠርተዋል');
    stopAuto();
    return;
  }
  var available = [];
  for (var i = 1; i <= 75; i++) {
    if (calledNumbers.indexOf(i) === -1) available.push(i);
  }
  var index = Math.floor(Math.random() * available.length);
  var number = available[index];
  calledNumbers.push(number);
  showCalled(number);
}

function stopAuto() {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
  }
}

function checkCardBingo(card) {
  if (!card || card.length === 0) return false;
  for (var r = 0; r < 5; r++) {
    var ok = true;
    for (var c = 0; c < 5; c++) {
      var index = r * 5 + c;
      if (index === 12) continue;
      if (calledNumbers.indexOf(card[index]) === -1) ok = false;
    }
    if (ok) return true;
  }
  for (var c = 0; c < 5; c++) {
    var ok = true;
    for (var r = 0; r < 5; r++) {
      var index = r * 5 + c;
      if (index === 12) continue;
      if (calledNumbers.indexOf(card[index]) === -1) ok = false;
    }
    if (ok) return true;
  }
  var diag1 = true, diag2 = true;
  for (var i = 0; i < 5; i++) {
    var a = i * 5 + i;
    var b = i * 5 + (4 - i);
    if (a !== 12 && calledNumbers.indexOf(card[a]) === -1) diag1 = false;
    if (b !== 12 && calledNumbers.indexOf(card[b]) === -1) diag2 = false;
  }
  if (diag1 || diag2) return true;
  var corners = [0, 4, 20, 24];
  var allCorners = true;
  for (var k = 0; k < corners.length; k++) {
    if (calledNumbers.indexOf(card[corners[k]]) === -1) allCorners = false;
  }
  if (allCorners) return true;
  return false;
}

// ========== BUTTON LISTENERS ==========
document.getElementById('loginBtn').addEventListener('click', function() {
  var input = document.getElementById('playerName');
  player = input.value.trim();
  if (!player) { alert('እባክዎ ስምዎን ያስገቡ'); return; }
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('gameSection').classList.remove('hidden');
  document.getElementById('gameId').textContent = generateGameId();
  createNumberBoard();
});

document.getElementById('createCardsBtn').addEventListener('click', function() {
  var count = parseInt(document.getElementById('cardNumberInput').value);
  if (isNaN(count) || count < 1 || count > 600) { alert('1-600 ብቻ!'); return; }
  cards = [];
  for (var i = 0; i < count; i++) {
    cards.push(generateSingleCard());
  }
  activeCardIndex = 0;
  document.getElementById('cardsCount').textContent = count;
  document.getElementById('cardsNav').classList.remove('hidden');
  document.getElementById('cardLabel').classList.remove('hidden');
  document.getElementById('bingoCardGrid').classList.remove('hidden');
  document.getElementById('bingoBtn').classList.remove('hidden');
  document.getElementById('cardSelectSection').classList.add('hidden');
  showActiveCard();
  alert(count + ' ካርዶች ተፈጥረዋል! 🎴');
});

document.getElementById('prevCardBtn').addEventListener('click', function() {
  if (cards.length <= 1) return;
  activeCardIndex = (activeCardIndex - 1 + cards.length) % cards.length;
  showActiveCard();
});

document.getElementById('nextCardBtn').addEventListener('click', function() {
  if (cards.length <= 1) return;
  activeCardIndex = (activeCardIndex + 1) % cards.length;
  showActiveCard();
});

document.getElementById('callBtn').addEventListener('click', callNumber);

document.getElementById('autoBtn').addEventListener('click', function() {
  if (autoTimer) { stopAuto(); return; }
  callNumber();
  autoTimer = setInterval(callNumber, 3000);
});

document.getElementById('stopBtn').addEventListener('click', stopAuto);

document.getElementById('bingoBtn').addEventListener('click', function() {
  if (cards.length === 0) { alert('ካርድ አልተዘጋጀም'); return; }
  var winnerCard = -1;
  for (var i = 0; i < cards.length; i++) {
    if (checkCardBingo(cards[i])) { winnerCard = i; break; }
  }
  if (winnerCard !== -1) {
    stopAuto();
    document.getElementById('winnerText').textContent =
      player + ' እንኳን ደስ አለዎት! ካርድ #' + (winnerCard + 1) + ' BINGO አሸንፏል! 🎉';
    document.getElementById('popup').style.display = 'flex';
  } else {
    alert('እስካሁን BINGO አልሆነም።');
  }
});

document.getElementById('closePopupBtn').addEventListener('click', function() {
  document.getElementById('popup').style.display = 'none';
});

document.getElementById('newGameBtn').addEventListener('click', function() {
  stopAuto();
  calledNumbers = [];
  cards = [];
  activeCardIndex = 0;
  document.getElementById('currentNumber').textContent = '--';
  document.getElementById('currentAmharic').textContent = 'ጨዋታው አልጀመረም';
  document.getElementById('calledCount').textContent = '0';
  document.getElementById('cardsCount').textContent = '0';
  document.getElementById('recent').innerHTML = '';
  document.getElementById('gameId').textContent = generateGameId();
  document.getElementById('cardsNav').classList.add('hidden');
  document.getElementById('cardLabel').classList.add('hidden');
  document.getElementById('bingoCardGrid').classList.add('hidden');
  document.getElementById('bingoBtn').classList.add('hidden');
  document.getElementById('cardSelectSection').classList.remove('hidden');
  var nums = document.querySelectorAll('.number');
  for (var i = 0; i < nums.length; i++) nums[i].classList.remove('called');
});

// Auto BINGO check
checkInterval = setInterval(function() {
  if (cards.length === 0) return;
  for (var i = 0; i < cards.length; i++) {
    if (checkCardBingo(cards[i])) {
      stopAuto();
      document.getElementById('winnerText').textContent =
        player + ' እንኳን ደስ አለዎት! ካርድ #' + (i + 1) + ' BINGO አሸንፏል! 🎉';
      document.getElementById('popup').style.display = 'flex';
      return;
    }
  }
}, 1000);
</script>
</body>
</html>
